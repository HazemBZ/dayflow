# Release pipeline — builds Dayflow desktop app for macOS + Windows.
# Triggers on push to `release` branch or manual dispatch.
#
# Build matrix:
#   macOS (Apple Silicon) → .dmg
#   macOS (Intel)        → .dmg
#   Windows x64          → .exe (NSIS)
#
# macOS signing requires these secrets:
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
#   APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#
name: release

on:
  workflow_dispatch:
  push:
    branches:
      - release

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
            rust-targets: aarch64-apple-darwin
          - platform: macos-13
            target: x86_64-apple-darwin
            bundle: dmg
            rust-targets: x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Node.js + pnpm --------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # --- Rust toolchain --------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # --- macOS code-signing certificate ----------------------------------
      - name: Import Apple signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Skip if no certificate configured
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No APPLE_CERTIFICATE secret — skipping signing setup"
            exit 0
          fi

          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "Imported certificate:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      # --- Resolve macOS signing identity --------------------------------
      # When Apple secrets exist, sign with the Developer ID + notarize.
      # Otherwise ad-hoc sign ("-") and skip notarization entirely, so
      # unsigned builds still bundle and run.
      - name: Resolve signing identity
        if: runner.os == 'macOS'
        run: |
          if [ -n "${{ secrets.APPLE_SIGNING_IDENTITY }}" ]; then
            echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> "$GITHUB_ENV"
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
            echo "APPLE_PASSWORD=${{ secrets.APPLE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      # --- Build Tauri app -------------------------------------------------
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass target triple to build-sidecar.sh
          TARGET_TRIPLE: ${{ matrix.target }}
        with:
          tagName: v__VERSION__
          releaseName: "Dayflow v__VERSION__"
          releaseBody: |
            See assets below to download and install.

            ## Install

            - **macOS** — Download `.dmg`, open, drag to Applications.
            - **Windows** — Download `-setup.exe`, run installer.

            ## Note

            Builds are unsigned, so no auto-update — download the new
            version manually for each release.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}

  # -------------------------------------------------------------------------
  # Finalize: publish the draft release once ALL matrix builds succeed
  # -------------------------------------------------------------------------
  publish:
    needs: build
    if: github.ref_type == 'tag' || github.ref_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null \
                     || echo "v$(node -p "require('./src-tauri/tauri.conf.json').version")")
          gh release edit "$VERSION" --draft=false --latest 2>/dev/null \
            || echo "Release $VERSION not found or already published — skipping"
